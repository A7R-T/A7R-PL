[package]
name = "a7r-sb"
version = "0.1.0"
description = "A7R Superbrain - Ultimate Productivity App"
authors = ["A7R"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
